[package]
name = "tog"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line access to agentic services"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt", "time"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
