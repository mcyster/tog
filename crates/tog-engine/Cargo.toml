[package]
name = "tog-engine"
description = "Conversation execution: invoking models, dispatching tools, and recording results"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
tog = { path = "../tog" }
tog-context = { path = "../tog-context" }

[dev-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde_json = "1.0"
tog-store-local = { path = "../tog-store-local" }
tog-tools = { path = "../tog-tools" }
tokio = { version = "1.47", features = ["macros", "rt", "time"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[lints]
workspace = true