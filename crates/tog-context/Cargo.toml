[package]
name = "tog-context"
description = "Environment and toolset, resolving the capabilities available for work"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
serde_json = "1.0"
tog = { path = "../tog" }

[dev-dependencies]
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["macros", "rt", "time"] }

[lints]
workspace = true