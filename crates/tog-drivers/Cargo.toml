[package]
name = "tog-drivers"
description = "Concrete model-driver providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
schemars = { version = "1.2", features = ["derive"] }
serde_json = "1.0"
tog = { path = "../tog" }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "time"] }

