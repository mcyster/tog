[package]
name = "tog"
description = "Conversations, model-driver interface, assets, and storage contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[lints]
workspace = true