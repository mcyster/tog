[package]
name = "tog-tools"
description = "Concrete tool implementations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tog = { path = "../tog" }
tog-context = { path = "../tog-context" }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[lints]
workspace = true