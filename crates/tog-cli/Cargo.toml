[package]
name = "tog-cli"
description = "Command-line access to agentic services"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tog"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
infer = "0.22"
serde_json = "1.0"
tog = { path = "../tog" }
tog-context = { path = "../tog-context" }
tog-drivers = { path = "../tog-drivers" }
tog-engine = { path = "../tog-engine" }
tog-store-local = { path = "../tog-store-local" }
tog-tools = { path = "../tog-tools" }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
uuid = { version = "1.18", features = ["serde", "v7"] }

[lints]
workspace = true